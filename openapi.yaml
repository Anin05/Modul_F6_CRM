openapi: 3.0.0
info:
  title: API Modul F-6 CRM Klien & Kontak
  description: Kontrak OpenAPI 3.0.0 untuk integrasi Modul F-6 CRM ERP PT Anaheim Nimbus Universal.
  version: 0.1.0
servers:
  - url: https://api.erp-anaheim.local/v1
    description: Server Lokal/Pengembangan

paths:
  /api/v1/clients:
    get:
      summary: Mendapatkan Daftar Klien Aktif
      operationId: listClients
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: Aktif
      responses:
        '200':
          description: Berhasil mengambil daftar klien
          content:
            application/json:
              example:
                $ref: './examples/list-clients-success.json'
        '401':
          description: Token tidak ada atau kedaluwarsa
          content:
            application/json:
              example:
                $ref: './examples/error.json'
        '403':
          description: Hak akses ditolak
          content:
            application/json:
              example:
                $ref: './examples/error.json'
