openapi: 3.0.3
info:
  title: F-6 CRM Klien dan Kontak API
  description: Spesifikasi Kontrak API untuk Modul F-6 (CRM Klien dan Kontak) ERP PT Anaheim Nimbus Universal.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local Development Server

paths:
  /clients:
    get:
      summary: Menampilkan daftar seluruh klien
      operationId: listClients
      tags:
        - Clients
      parameters:
        - name: q
          in: query
          description: Kata kunci pencarian nama atau kode klien
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Filter status klien (active/inactive)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Berhasil mengambil daftar klien
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
    post:
      summary: Menambahkan data klien baru
      operationId: createClient
      tags:
        - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientInput'
      responses:
        '201':
          description: Klien berhasil ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Klien berhasil ditambahkan.
                  data:
                    $ref: '#/components/schemas/Client'
        '400':
          description: Validasi gagal / Kode duplikat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /clients/{clientId}:
    get:
      summary: Menampilkan detail klien berdasarkan ID atau Kode
      operationId: getClientById
      tags:
        - Clients
      parameters:
        - name: clientId
          in: path
          required: true
          description: UUID atau Kode Klien (misal KLI-001)
          schema:
            type: string
      responses:
        '200':
          description: Berhasil mendapatkan detail klien
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Client'
        '404':
          description: Klien tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Memperbarui data klien
      operationId: updateClient
      tags:
        - Clients
      parameters:
        - name: clientId
          in: path
          required: true
          description: UUID atau Kode Klien
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientInput'
      responses:
        '200':
          description: Klien berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Klien berhasil diperbarui.
                  data:
                    $ref: '#/components/schemas/Client'

components:
  schemas:
    Client:
      type: object
      properties:
        id:
          type: string
          example: 01a17853-41ae-72b3-b76d-c78de8d03c6f
        code:
          type: string
          example: KLI-001
        name:
          type: string
          example: PT Anaheim Nimbus Universal
        address:
          type: string
          example: Jl. Jendral Sudirman No. 123
        city:
          type: string
          example: Jakarta
        phone:
          type: string
          example: 021-55501200
        mobile:
          type: string
          example: 081234567890
        email:
          type: string
          example: info@anaheim.co.id
        status:
          type: string
          example: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateClientInput:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          example: KLI-001
        name:
          type: string
          example: PT Anaheim Nimbus Universal
        address:
          type: string
          example: Jl. Jendral Sudirman No. 123
        city:
          type: string
          example: Jakarta
        phone:
          type: string
          example: 021-55501200
        mobile:
          type: string
          example: 081234567890
        email:
          type: string
          example: info@anaheim.co.id

    UpdateClientInput:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        phone:
          type: string
          example: 021-55509999
        mobile:
          type: string
        email:
          type: string
          example: contact@anaheim.co.id

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Data klien tidak valid.
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                code:
                  - The code has already been taken.
